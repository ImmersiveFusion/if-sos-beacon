# sos-beacon example config (one-shot, openai-compatible AI, Discord sink, file
# store). Copy to config.yaml and edit.
#
# Secrets never live in this file: every credential is named as an env var here
# and read from the environment at runtime.
#
#   export OAI_KEY=...              # your LLM API key
#   export OAI_BASE_URL=...         # e.g. https://api.openai.com/v1 or your Azure OpenAI base
#   export SOS_APM_WEBHOOK=...      # a Discord channel webhook URL
#   export SOS_AI_WEBHOOK=...
#   export REDDIT_CLIENT_ID=...     # only if a beacon lists the reddit source
#   export REDDIT_CLIENT_SECRET=...
#   ./sos-beacon -config config.yaml
#
# Notes:
# - `keywords` drives the server-side searches (HN and Reddit query once per
#   keyword) and the cheap client-side pre-filter for firehose sources. The full
#   boolean `filter` grammar (AND/OR/NOT) arrives in Phase 1.
# - The three sources differ in how they narrow, which is what you tune:
#     hn        keyword search per keyword, no auth
#     reddit    keyword search per keyword across a multireddit, app-only OAuth
#     lobsters  no keyword search API exists, so it fetches the newest feed plus
#               any tag-scoped feeds you name and the pre-filter does the rest
# - Lobsters posts are mostly bare links with an empty body, so their TAGS carry
#   the topicality. Put the tag names in `keywords` too if you want tag
#   membership alone to pass the pre-filter (the classifier sees tags either way).
# - For Azure OpenAI, set `api_version` and point `base_url_env` at the deployment
#   base; the adapter then uses the api-key header instead of Bearer auth.

# ---- global backends (the ports' adapters) ----
ai:
  provider: openai-compatible
  base_url_env: OAI_BASE_URL
  model: gpt-5
  key_env: OAI_KEY
  # api_version: 2024-10-21   # uncomment for Azure OpenAI

store:
  type: file
  path: ./sos-state.json

# Azure SQL / SQL Server store (pure-Go driver, keeps CGO_ENABLED=0). Pick ONE
# way to point at your own database; no server name or secret is baked into the
# repo. Use a throwaway database for local runs.
#
# store:
#   type: azuresql
#   # (a) Entra / passwordless via local `az login` (fedauth=ActiveDirectoryDefault):
#   server: your-server.database.windows.net
#   database: sos_beacon
#   # (b) or a full DSN instead of server+database:
#   # dsn: "sqlserver://user:pass@your-server.database.windows.net?database=sos_beacon"
#   # (c) or override either of the above from the environment (cluster secret-store path):
#   #   export SOS_STORE_DSN="sqlserver://..."

beacons:
  # A) default-template beacon (sufferers + incumbents)
  - name: sos-apm
    mode: dispatch
    sources: [hn, lobsters]
    # Reddit is OFF by default and deliberately not in `sources` above. Read
    # SECURITY.md / the README section on Reddit before you enable it: Reddit's
    # Developer Terms restrict Data API access by a business, so whether you may
    # run it depends on who you are, not on this config. Immersive Fusion does
    # not run this source. If you are entitled to, register ONE "web app" (never
    # a "script" app: that type means personal use, and Data API Terms S2.8 bars
    # misrepresenting your OAuth identity), then add `reddit` to `sources` and:
    #
    # reddit:
    #   subreddits: [devops, sre, kubernetes, ExperiencedDevs, selfhosted]
    #   client_id_env: REDDIT_CLIENT_ID        # env var NAMES; these are the defaults
    #   client_secret_env: REDDIT_CLIENT_SECRET
    # Lobsters: tag-scoped feeds polled alongside the global newest feed.
    lobsters:
      tags: [devops, performance, practices, debugging, distributed]
    keywords: [datadog, "new relic", observability, APM, devops, performance]
    filter: '(datadog OR "new relic" OR observability OR APM) AND NOT (hiring OR job)'
    context: |
      IAPM is 3D/VR spatial observability APM on OpenTelemetry. Incumbents: Datadog,
      New Relic, Grafana. Pain: alert fatigue, dashboard sprawl, MTTR, per-host pricing.
    buckets:
      - { name: seeker,           emoji: "🙋", definition: "actively asking for a tool recommendation" }
      - { name: incumbent-rage,   emoji: "🔥", definition: "furious at a vendor's bill or behavior" }
      - { name: problem-adjacent, emoji: "🌫️", definition: "describes the pain without asking for tools" }
    destination: { type: discord, webhook_env: SOS_APM_WEBHOOK }
    thresholds: { realtime: 0.75, digest: 0.50 }
    max_age: 12h

  # B) custom-bucket, watch-mode beacon (no rage/seeker anywhere)
  - name: sos-ai
    mode: watch
    sources: [hn]
    keywords: [AGI, "the model", benchmark, "AI safety"]
    filter: '(AGI OR "the model" OR benchmark OR "AI safety") AND NOT hiring'
    context: "Honest AI discourse: overstated claims, opaque proprietary agents, gamed benchmarks."
    buckets:
      - { name: hype-claim,        emoji: "🎈", definition: "overstated capability claim presented as fact" }
      - { name: benchmark-dispute, emoji: "📊", definition: "contested or gamed benchmark result" }
      - { name: genuine-question,  emoji: "🙋", definition: "someone actually asking, in good faith" }
    destination: { type: discord, webhook_env: SOS_AI_WEBHOOK }
    thresholds: { realtime: 0.80, digest: 0.50 }
    max_age: 24h
